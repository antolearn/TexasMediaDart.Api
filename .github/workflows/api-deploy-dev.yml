name: API Deploy - Dev

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.303'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'TexasMediaDart.slnx'
  API_PROJECT: 'src/TexasMediaDart.Api/TexasMediaDart.Api.csproj'
  PUBLISH_PATH: '${{ github.workspace }}/publish'
  AZURE_WEBAPP_NAME: 'texasmediadart-api-dev'

jobs:
  build:
    name: Build Release API
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate build version
        id: version
        shell: bash
        run: |
          DATE=$(date +'%Y.%m.%d')
          BUILD=$(printf "%04d" "$GITHUB_RUN_NUMBER")
          VERSION="$DATE.$BUILD"

          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "API Release Version: $VERSION"

          echo "### API Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "**$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Publish API
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ${{ env.PUBLISH_PATH }}
          /p:InformationalVersion=${{ env.BUILD_VERSION }}
          /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Create versioned API package
        shell: bash
        run: |
          mkdir -p artifacts

          cd "${{ env.PUBLISH_PATH }}"

          zip -r \
            "${{ github.workspace }}/artifacts/TexasMediaDart.Api-${BUILD_VERSION}.zip" \
            .

          echo "Created API package:"
          echo "TexasMediaDart.Api-${BUILD_VERSION}.zip"

      - name: Upload versioned API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Api-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Api-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy-dev:
    name: Deploy API to Dev
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Display API Version
        run: |
          echo "Deploying API Version:"
          echo "${{ needs.build.outputs.build_version }}"

      - name: Download versioned API artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Api-${{ needs.build.outputs.build_version }}
          path: artifacts

      - name: Verify API package
        shell: bash
        run: |
          PACKAGE="artifacts/TexasMediaDart.Api-${{ needs.build.outputs.build_version }}.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "API package was not found:"
            echo "$PACKAGE"
            exit 1
          fi

          echo "API package:"
          echo "$PACKAGE"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate DEV configuration
        shell: bash
        env:
          IDENTITY_SERVICE_API_KEY: ${{ secrets.IDENTITY_SERVICE_API_KEY }}
          ORGANIZATION_SERVICE_API_KEY: ${{ secrets.ORGANIZATION_SERVICE_API_KEY }}
          COMMUNICATION_SERVICES_CONNECTION_STRING: ${{ secrets.COMMUNICATION_SERVICES_CONNECTION_STRING }}
        run: |
          if [ -z "$IDENTITY_SERVICE_API_KEY" ]; then
            echo "ERROR: GitHub secret IDENTITY_SERVICE_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$ORGANIZATION_SERVICE_API_KEY" ]; then
            echo "ERROR: GitHub secret ORGANIZATION_SERVICE_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$COMMUNICATION_SERVICES_CONNECTION_STRING" ]; then
            echo "ERROR: GitHub secret COMMUNICATION_SERVICES_CONNECTION_STRING is missing or empty."
            exit 1
          fi

          echo "Required DEV secrets are available to the deployment."

      - name: Configure DEV application settings
        shell: bash
        env:
          IDENTITY_SERVICE_API_KEY: ${{ secrets.IDENTITY_SERVICE_API_KEY }}
          ORGANIZATION_SERVICE_API_KEY: ${{ secrets.ORGANIZATION_SERVICE_API_KEY }}
          COMMUNICATION_SERVICES_CONNECTION_STRING: ${{ secrets.COMMUNICATION_SERVICES_CONNECTION_STRING }}
        run: |
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "TexasMediaDart-Dev" \
            --settings \
              "COMMUNICATION_SERVICES_CONNECTION_STRING=$COMMUNICATION_SERVICES_CONNECTION_STRING" \
              "Email__Provider=${{ vars.EMAIL_PROVIDER }}" \
              "Email__SenderAddress=${{ vars.EMAIL_SENDER_ADDRESS }}" \
              "Email__SenderDisplayName=${{ vars.EMAIL_SENDER_DISPLAY_NAME }}" \
              "Frontend__BaseUrl=${{ vars.FRONTEND_BASE_URL }}" \
              "ServiceAuthentication__IdentityApiKey=$IDENTITY_SERVICE_API_KEY" \
              "ServiceAuthentication__OrganizationApiKey=$ORGANIZATION_SERVICE_API_KEY"

      - name: Verify DEV service authentication settings
        shell: bash
        run: |
          IDENTITY_SETTING=$(az webapp config appsettings list \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "TexasMediaDart-Dev" \
            --query "[?name=='ServiceAuthentication__IdentityApiKey'].name | [0]" \
            --output tsv)

          if [ "$IDENTITY_SETTING" != "ServiceAuthentication__IdentityApiKey" ]; then
            echo "ERROR: ServiceAuthentication__IdentityApiKey was not created in Azure App Service."
            exit 1
          fi

          ORGANIZATION_SETTING=$(az webapp config appsettings list \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "TexasMediaDart-Dev" \
            --query "[?name=='ServiceAuthentication__OrganizationApiKey'].name | [0]" \
            --output tsv)

          if [ "$ORGANIZATION_SETTING" != "ServiceAuthentication__OrganizationApiKey" ]; then
            echo "ERROR: ServiceAuthentication__OrganizationApiKey was not created in Azure App Service."
            exit 1
          fi

          echo "Identity service authentication setting exists."
          echo "Organization service authentication setting exists."

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/TexasMediaDart.Api-${{ needs.build.outputs.build_version }}.zip

      - name: Validate DEV API health
        shell: bash
        run: |
          HEALTH_URL="${{ vars.API_BASE_URL }}/health/db"

          echo "Waiting for DEV API to start..."
          sleep 15

          echo "Checking API health:"
          echo "$HEALTH_URL"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL"

          echo
          echo "DEV API health validation passed."